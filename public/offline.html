<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline</title>
    <!-- Custom CSS for a sleek, responsive design without Tailwind -->
    <style>
        /* CSS Variables for easy color theme management */
        :root {
            --bg-color: #000319;
            --nav-bg: #0a0d24;
            --text-color: #e5e7eb; /* gray-200 */
            --subtle-text-color: #9ca3af; /* gray-400 */
            --link-color-linkedin: #3b82f6; /* blue-500 */
            --link-color-github: #f3f4f6; /* gray-100 */
            --link-color-instagram: #ec4899; /* pink-500 */
            --button-bg: #374151; /* gray-700 */
            --button-hover-bg: #4b5563; /* gray-600 */
        }

        body {
            /* Using a system font stack instead of an online resource */
            font-family: 'system-ui', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background-color 0.3s ease;
        }

        /* Navbar Styling */
        .navbar {
            padding: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: var(--nav-bg);
            border-bottom-left-radius: 0.75rem;
            border-bottom-right-radius: 0.75rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .navbar-title {
            font-size: 1.5rem; /* 24px */
            font-weight: 700; /* bold */
            color: #fff;
            letter-spacing: 0.025em; /* tracking-wide */
        }

        .social-links {
            display: flex;
            align-items: center;
            gap: 1rem; /* space-x-4 */
        }

        .social-link {
            color: var(--subtle-text-color);
            transition: transform 0.2s ease-in-out, color 0.2s ease-in-out;
        }

        .social-link:hover {
            transform: scale(1.1);
        }

        .social-link.linkedin:hover {
            color: var(--link-color-linkedin);
        }

        .social-link.github:hover {
            color: var(--link-color-github);
        }

        .social-link.instagram:hover {
            color: var(--link-color-instagram);
        }

        /* Main Content Styling */
        .main-content {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .message-container {
            text-align: center;
            max-width: 42rem; /* max-w-2xl */
            animation: fadeIn 1s ease-out;
        }

        .message-heading {
            font-size: 3rem; /* 48px */
            font-weight: 800; /* extrabold */
            color: #fff;
            margin-bottom: 1rem;
        }

        .message-subtext {
            font-size: 1.25rem; /* 20px */
            color: var(--subtle-text-color);
        }

        .try-again-btn {
            margin-top: 2rem;
            padding: 0.75rem 1.5rem;
            background-color: var(--button-bg);
            color: #fff;
            font-weight: 500;
            border-radius: 9999px; /* rounded-full */
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            transition: background-color 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .try-again-btn:hover {
            background-color: var(--button-hover-bg);
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Responsive design for medium screens and up */
        @media (min-width: 768px) {
            .navbar {
                padding: 2rem;
            }
            .navbar-title {
                font-size: 1.875rem; /* 30px */
            }
            .message-heading {
                font-size: 4.5rem; /* 72px */
            }
            .message-subtext {
                font-size: 1.5rem; /* 24px */
            }
        }
    </style>
</head>
<body>
    
    <!-- Navbar with title on left and social links on right -->
    <nav class="navbar">
        <!-- Title section -->
        <div class="navbar-title">
            Maaz Bin Asif
        </div>

        <!-- Social links section -->
        <div class="social-links">
            <!-- LinkedIn Icon -->
            <a href="https://www.github.com/maaz-319" class="social-link linkedin">
                Github
            </a>
            <!-- GitHub Icon -->
            <a href="https://www.linkedin.com/in/maazbinasif" class="social-link github">
                Linkedin
            </a>
            <!-- Instagram Icon -->
            <a href="https://www.instagram.com/maaz.binasif" class="social-link instagram">
                Instagram
            </a>
        </div>
    </nav>
    
    <!-- Main content container, centered and animated -->
    <main class="main-content">
        <div class="message-container">
            <h1 class="message-heading">
                🥹
            </h1>
            <p class="message-subtext">
                Looks like you're offline. Please check your internet connection.
            </p>
            <div class="mt-8 flex justify-center">
                <a href="#" onclick="window.location.reload();" class="try-again-btn">
                    Try Again
                </a>
            </div>
        </div>
    </main>

</body>
</html>
