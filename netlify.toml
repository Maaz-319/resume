# This file configures Netlify for a Next.js PWA project.

[build]
  command = "npm run build"
  publish = "out"  # or ".next" depending on your Next.js version and build process

# The [[headers]] section is critical for the PWA service worker.
# It ensures that the service worker is not cached by the browser,
# which is necessary for"icons": [
      {
        "src": "/icons/icon-192x192.png",
        "sizes": "192x192",
        "type": "image/png"
      },
      {
        "src": "/icons/icon-512x512.png",
        "sizes": "512x512",
        "type": "image/png"
      }
    ] it to update correctly.
[[headers]]
  for = "/_next/static/service-worker.js" # This is the typical path for the generated sw.js
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/workbox-*.js"
  [headers.values]
    Cache-Control = "no-cache"

# You might also need to add a rewrite rule for the service worker
# if Netlify's default behavior is causing issues.
[[redirects]]
  from = "/sw.js"
  to = "/_next/static/service-worker.js"
  status = 200
